<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema Raquel Aguiar | Oficial</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .turma-select { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-turma { flex: 1; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; background: #e0e0e0; font-size: 16px; }
        .btn-turma.ativa { background: #007bff; color: white; }
        .upload-box { border: 2px dashed #007bff; border-radius: 10px; padding: 20px; text-align: center; color: #007bff; cursor: pointer; margin: 10px 0; background: #f0f7ff; }
        .preview-img { max-width: 100%; max-height: 300px; margin-top: 10px; border-radius: 8px; display: none; }
        .grade { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .box { width: 30px; height: 30px; line-height: 30px; text-align: center; border-radius: 5px; color: white; font-weight: bold; font-size: 12px; }
        .correto { background-color: #28a745; }
        .errado { background-color: #dc3545; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-main { background: #28a745; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .abas { display: flex; gap: 20px; border-bottom: 2px solid #ddd; margin-bottom: 15px; }
        .aba { padding: 10px; cursor: pointer; font-weight: bold; color: #666; }
        .aba.ativa { color: #007bff; border-bottom: 3px solid #007bff; }
        .item-aluno { border-bottom: 1px solid #eee; padding: 15px 0; position: relative; }
        .btn-del { position: absolute; right: 0; top: 15px; background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="turma-select">
        <button id="b8" class="btn-turma ativa" onclick="mudarTurma('8ano')">8º ANO</button>
        <button id="b9" class="btn-turma" onclick="mudarTurma('9ano')">9º ANO</button>
    </div>

    <div class="card">
        <h3>1. Gabarito Oficial</h3>
        <div class="upload-box" onpaste="colarFoto(event, 'pOficial', 'hOficial', true)">
            Clique e Cole a Foto do Gabarito Oficial (Ctrl+V)
            <img id="pOficial" class="preview-img">
            <input type="hidden" id="hOficial">
        </div>
        <input type="text" id="inputOficial" placeholder="Digite as letras (Ex: ABCD...)" oninput="salvarOficial()">
    </div>

    <div class="card">
        <h3>2. Scanner do Aluno</h3>
        <input type="text" id="nomeAluno" placeholder="Nome Completo">
        <div class="upload-box" onpaste="colarFoto(event, 'pAluno', 'hAluno', false)">
            Clique e Cole a Foto da Prova do Aluno (Ctrl+V)
            <img id="pAluno" class="preview-img">
            <input type="hidden" id="hAluno">
        </div>
        <input type="text" id="resAluno" placeholder="Respostas (Ex: 1A 2B...)">
        <button class="btn-main" onclick="salvarAluno()">✅ CORRIGIR E SALVAR</button>
    </div>

    <div class="card">
        <div class="abas">
            <div id="t1" class="aba ativa" onclick="aba(1)">Alunos</div>
            <div id="t2" class="aba" onclick="aba(2)">Análise da Turma</div>
        </div>

        <div id="c1">
            <div id="lista">Carregando...</div>
        </div>

        <div id="c2" style="display:none;">
            <h4>Desempenho por Questão (Erros)</h4>
            <div id="stats"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://gestao-caed-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let turma = '8ano';
    const limpar = (t) => t ? t.toUpperCase().replace(/[^A-E]/g, '') : "";

    function mudarTurma(proxima) {
        turma = proxima;
        document.getElementById('b8').className = turma === '8ano' ? 'btn-turma ativa' : 'btn-turma';
        document.getElementById('b9').className = turma === '9ano' ? 'btn-turma ativa' : 'btn-turma';
        carregarConfig();
    }

    function colarFoto(e, imgTag, inputTag, ehOficial) {
        const item = e.clipboardData.items[0];
        if (item && item.type.indexOf("image") !== -1) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const b64 = event.target.result;
                document.getElementById(imgTag).src = b64;
                document.getElementById(imgTag).style.display = "block";
                document.getElementById(inputTag).value = b64;
                if(ehOficial) db.ref(`escola/${turma}/config/foto`).set(b64);
            };
            reader.readAsDataURL(item.getAsFile());
        }
    }

    function salvarOficial() {
        const txt = document.getElementById('inputOficial').value;
        db.ref(`escola/${turma}/config/gabarito`).set(txt);
    }

    function carregarConfig() {
        db.ref(`escola/${turma}/config`).on('value', snap => {
            const d = snap.val() || {};
            document.getElementById('inputOficial').value = d.gabarito || "";
            if(d.foto) {
                document.getElementById('pOficial').src = d.foto;
                document.getElementById('pOficial').style.display = "block";
            } else {
                document.getElementById('pOficial').style.display = "none";
            }
            ouvirAlunos();
        });
    }

    function salvarAluno() {
        const nome = document.getElementById('nomeAluno').value.toUpperCase();
        const res = limpar(document.getElementById('resAluno').value);
        const foto = document.getElementById('hAluno').value;
        if(!nome || !res) return alert("Nome e respostas são obrigatórios!");

        db.ref(`escola/${turma}/alunos`).push({ nome, res, foto }).then(() => {
            document.getElementById('nomeAluno').value = "";
            document.getElementById('resAluno').value = "";
            document.getElementById('pAluno').style.display = "none";
            document.getElementById('hAluno').value = "";
        });
    }

    function ouvirAlunos() {
        const oficial = limpar(document.getElementById('inputOficial').value);
        db.ref(`escola/${turma}/alunos`).on('value', snap => {
            const list = document.getElementById('lista');
            const stats = document.getElementById('stats');
            list.innerHTML = ""; stats.innerHTML = "";
            let erros = {}, totalA = snap.numChildren();

            snap.forEach(child => {
                const a = child.val();
                const resA = limpar(a.res);
                let nota = 0, boxes = "";

                for(let i=0; i<oficial.length; i++) {
                    const ok = (resA[i] === oficial[i] && oficial[i] !== undefined);
                    if(ok) nota++; else erros[i+1] = (erros[i+1] || 0) + 1;
                    boxes += `<div class="box ${ok ? 'correto' : 'errado'}">${i+1}</div>`;
                }

                list.innerHTML += `<div class="item-aluno">
                    <button class="btn-del" onclick="db.ref('escola/${turma}/alunos/${child.key}').remove()">Excluir</button>
                    <strong>${a.nome}</strong> - Nota: ${nota}/${oficial.length}
                    <div class="grade">${boxes}</div>
                    ${a.foto ? `<details><summary style="cursor:pointer; color:#007bff; font-size:12px">Ver Prova</summary><img src="${a.foto}" style="width:100%"></details>` : ''}
                </div>`;
            });

            Object.keys(erros).forEach(q => {
                let p = Math.round((erros[q]/totalA)*100);
                stats.innerHTML += `<div style="margin:5px 0">Q${q}: ${p}% de erros <div style="background:#eee; height:10px; border-radius:5px"><div style="background:red; width:${p}%; height:100%; border-radius:5px"></div></div></div>`;
            });
        });
    }

    function aba(n) {
        document.getElementById('c1').style.display = n===1 ? 'block' : 'none';
        document.getElementById('c2').style.display = n===2 ? 'block' : 'none';
        document.getElementById('t1').className = n===1 ? 'aba ativa' : 'aba';
        document.getElementById('t2').className = n===2 ? 'aba ativa' : 'aba';
    }

    window.onload = carregarConfig;
</script>
</body>
</html>
