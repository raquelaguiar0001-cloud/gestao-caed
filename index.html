<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Scanner Pedagógico | Raquel Aguiar</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fce4ec; padding: 20px; color: #333; }
        
        /* Cabeçalho com Turmas e Blocos */
        .header-top { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; max-width: 1200px; margin: 0 auto 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .turma-selector { display: flex; gap: 8px; border-right: 2px solid #eee; padding-right: 15px; }
        .testes-nav { display: flex; gap: 8px; align-items: center; overflow-x: auto; flex-grow: 1; }
        
        .btn-turma { padding: 8px 15px; border: 1px solid #333; background: white; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .btn-turma.ativa { background: #333; color: white; }
        
        .btn-teste { padding: 8px 12px; border: 1px solid #007bff; background: #f0f7ff; cursor: pointer; font-size: 13px; border-radius: 4px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
        .btn-teste.ativa { background: #007bff; color: white; }
        .btn-add { background: #28a745; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .del-x { color: #ff4d4d; cursor: pointer; font-weight: bold; padding: 0 5px; }

        /* Grid Principal conforme o esboço */
        .main-grid { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 15px; max-width: 1200px; margin: 0 auto; }
        .col { background: white; border: 1px solid #333; padding: 15px; border-radius: 8px; }
        .col-title { font-weight: bold; text-align: center; border-bottom: 1px solid #eee; margin-bottom: 15px; padding-bottom: 10px; background: #f9f9f9; margin: -15px -15px 15px -15px; padding: 10px; }

        .upload-zone { border: 2px dashed #007bff; padding: 15px; text-align: center; cursor: pointer; background: #f8fbff; margin-bottom: 10px; min-height: 80px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
        
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-acao { background: #28a745; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 16px; }
        
        /* Gráficos de Desempenho */
        .rank-item { margin-bottom: 12px; }
        .barra-bg { background: #eee; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 4px; border: 1px solid #ddd; }
        .barra-fill { height: 100%; background: #28a745; transition: 0.5s; }
        .item-aluno { padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-size: 14px; }
    </style>
</head>
<body>

<div class="header-top">
    <div class="turma-selector">
        <button id="bt8" class="btn-turma ativa" onclick="mudarTurma('8ano')">8º ANO</button>
        <button id="bt9" class="btn-turma" onclick="mudarTurma('9ano')">9º ANO</button>
    </div>
    
    <div class="testes-nav" id="testesNav"></div>
    
    <button class="btn-add" onclick="adicionarBloco()">+ NOVO BLOCO</button>
</div>

<div class="main-grid">
    <div class="col">
        <div class="col-title">Alunos e Configuração</div>
        <input type="text" id="oficialInput" placeholder="Gabarito Oficial (Ex: ABCD...)" oninput="salvarConfig()">
        <textarea id="temasInput" rows="3" placeholder="Habilidades (Separadas por vírgula)" oninput="salvarConfig()"></textarea>
        <hr>
        <input type="text" id="nomeAluno" placeholder="Nome do Aluno">
        <div class="upload-zone" id="dropZone">
            <span>Cole a Prova (Ctrl+V) ou digite as respostas abaixo</span>
        </div>
        <input type="text" id="resAluno" placeholder="Respostas do Aluno">
        <button class="btn-acao" onclick="salvarAluno()">✅ CORRIGIR E SALVAR</button>
    </div>

    <div class="col">
        <div class="col-title">Desempenho Geral</div>
        <div id="graficoTemas"></div>
    </div>

    <div class="col">
        <div class="col-title">Resultados da Turma</div>
        <div id="listaAlunos"></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://gestao-caed-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let turma = '8ano';
    let provaAtiva = 'CAED 1';

    function mudarTurma(t) {
        turma = t;
        document.getElementById('bt8').className = t === '8ano' ? 'btn-turma ativa' : 'btn-turma';
        document.getElementById('bt9').className = t === '9ano' ? 'btn-turma ativa' : 'btn-turma';
        carregarListaBlocos();
    }

    function carregarListaBlocos() {
        db.ref(`prof/v4/${turma}/provas_lista`).on('value', snap => {
            const nav = document.getElementById('testesNav');
            nav.innerHTML = "";
            let lista = snap.val() || ["CAED 1", "CAED 2"];
            
            lista.forEach(nome => {
                const btn = document.createElement('div');
                btn.className = `btn-teste ${nome === provaAtiva ? 'ativa' : ''}`;
                btn.innerHTML = `<span onclick="selecionarBloco('${nome}')">${nome}</span> 
                                 <span class="del-x" onclick="excluirBloco('${nome}')">✖</span>`;
                nav.appendChild(btn);
            });
            selecionarBloco(provaAtiva || lista[0]);
        });
    }

    function selecionarBloco(nome) {
        provaAtiva = nome;
        carregarConfig();
    }

    function adicionarBloco() {
        const nome = prompt("Nome do novo bloco (ex: 1º Bimestre):");
        if(nome) {
            db.ref(`prof/v4/${turma}/provas_lista`).once('value', snap => {
                let lista = snap.val() || ["CAED 1", "CAED 2"];
                if(!lista.includes(nome)) {
                    lista.push(nome);
                    db.ref(`prof/v4/${turma}/provas_lista`).set(lista);
                }
            });
        }
    }

    function excluirBloco(nome) {
        if(confirm(`Excluir o bloco "${nome}"?`)) {
            db.ref(`prof/v4/${turma}/provas_lista`).once('value', snap => {
                let lista = snap.val().filter(p => p !== nome);
                db.ref(`prof/v4/${turma}/provas_lista`).set(lista);
                db.ref(`prof/v4/${turma}/${nome}`).remove();
                provaAtiva = lista[0];
            });
        }
    }

    function salvarConfig() {
        const gab = document.getElementById('oficialInput').value.toUpperCase().replace(/[^A-D]/g, '');
        const temas = document.getElementById('temasInput').value;
        db.ref(`prof/v4/${turma}/${provaAtiva}/config`).set({ gab, temas });
    }

    function carregarConfig() {
        db.ref(`prof/v4/${turma}/${provaAtiva}/config`).on('value', snap => {
            const d = snap.val() || {};
            document.getElementById('oficialInput').value = d.gab || "";
            document.getElementById('temasInput').value = d.temas || "";
            ouvirAlunos();
        });
    }

    function salvarAluno() {
        const nome = document.getElementById('nomeAluno').value.toUpperCase().trim();
        const res = document.getElementById('resAluno').value.toUpperCase().replace(/[^A-D]/g, '');
        if(!nome || !res) return alert("Preencha nome e respostas!");
        
        db.ref(`prof/v4/${turma}/${provaAtiva}/alunos`).push({ nome, res }).then(() => {
            document.getElementById('nomeAluno').value = "";
            document.getElementById('resAluno').value = "";
        });
    }

    function ouvirAlunos() {
        const oficial = document.getElementById('oficialInput').value.trim();
        const temasArr = document.getElementById('temasInput').value.split(',').map(s => s.trim());
        
        db.ref(`prof/v4/${turma}/${provaAtiva}/alunos`).on('value', snap => {
            const lista = document.getElementById('listaAlunos');
            const grafico = document.getElementById('graficoTemas');
            lista.innerHTML = ""; grafico.innerHTML = "";
            let acertosPorQuestao = {}, totalAlunos = snap.numChildren();

            snap.forEach(child => {
                const a = child.val();
                let acertos = 0;
                for(let i=0; i < oficial.length; i++) {
                    if(a.res[i] === oficial[i] && oficial[i]) {
                        acertos++;
                        acertosPorQuestao[i+1] = (acertosPorQuestao[i+1] || 0) + 1;
                    }
                }
                lista.innerHTML += `<div class="item-aluno"><span>${a.nome}</span> <b style="color:#28a745">${acertos}/${oficial.length}</b></div>`;
            });

            for(let i=1; i <= oficial.length; i++) {
                let percAcerto = totalAlunos > 0 ? Math.round(((acertosPorQuestao[i]||0)/totalAlunos)*100) : 0;
                grafico.innerHTML += `
                    <div class="rank-item">
                        <div style="display:flex; justify-content:space-between; font-size:11px;">
                            <span>Q${i}: ${temasArr[i-1] || '---'}</span>
                            <b>${percAcerto}% acerto</b>
                        </div>
                        <div class="barra-bg"><div class="barra-fill" style="width:${percAcerto}%"></div></div>
                    </div>`;
            }
        });
    }

    window.onload = () => mudarTurma('8ano');
</script>
</body>
</html>
