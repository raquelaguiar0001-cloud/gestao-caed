<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Scanner Pedagógico | Raquel Aguiar</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fce4ec; padding: 20px; color: #333; }
        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 15px; }
        .turma-selector { display: flex; gap: 8px; }
        .btn-turma { padding: 8px 15px; border: 1px solid #333; background: white; cursor: pointer; font-weight: bold; }
        .btn-turma.ativa { background: #333; color: white; }
        
        .main-grid { display: grid; grid-template-columns: 1.2fr 1fr 1.2fr; gap: 15px; max-width: 1200px; margin: 0 auto; }
        .col { background: white; border: 1px solid #333; padding: 15px; border-radius: 8px; }
        .col-title { font-weight: bold; text-align: center; border-bottom: 1px solid #eee; margin-bottom: 15px; padding-bottom: 5px; }

        .upload-zone { border: 2px dashed #007bff; padding: 15px; text-align: center; cursor: pointer; background: #f8fbff; margin-bottom: 10px; position: relative; }
        .upload-zone canvas { max-width: 100%; display: none; margin-top: 10px; }
        
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-acao { background: #28a745; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 16px; }
        
        .rank-item { margin-bottom: 12px; }
        .barra-bg { background: #eee; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 4px; }
        .barra-fill { height: 100%; background: #dc3545; transition: 0.5s; }
        .item-aluno { padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; }
    </style>
</head>
<body>

<div class="header-top">
    <div class="turma-selector">
        <button id="bt8" class="btn-turma ativa" onclick="mudarTurma('8ano')">8º ANO</button>
        <button id="bt9" class="btn-turma" onclick="mudarTurma('9ano')">9º ANO</button>
    </div>
    <div id="testesNav" style="display: flex; gap: 10px;"></div>
</div>

<div class="main-grid">
    <div class="col">
        <div class="col-title">1. Configuração do Teste</div>
        <div class="upload-zone" onpaste="colarImagem(event, 'canvasOficial', 'oficialInput')">
            <span>Cole o Gabarito Oficial</span>
            <canvas id="canvasOficial"></canvas>
        </div>
        <input type="text" id="oficialInput" placeholder="Gabarito (Ex: DBADABDDA...)" oninput="salvarConfig()">
        <textarea id="temasInput" rows="4" placeholder="Habilidades (Separadas por vírgula)" oninput="salvarConfig()"></textarea>
    </div>

    <div class="col">
        <div class="col-title">2. Escaneamento do Aluno</div>
        <input type="text" id="nomeAluno" placeholder="Nome do Aluno">
        <div class="upload-zone" onpaste="colarImagem(event, 'canvasAluno', 'resAluno')">
            <span>Cole a Prova do Aluno</span>
            <canvas id="canvasAluno"></canvas>
        </div>
        <input type="text" id="resAluno" placeholder="Respostas Detectadas">
        <button class="btn-acao" onclick="salvarAluno()">✅ CORRIGIR E SALVAR</button>
    </div>

    <div class="col">
        <div class="col-title">3. Análise Pedagógica</div>
        <div id="graficoTemas"></div>
        <hr>
        <div id="listaAlunos"></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://gestao-caed-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let turma = '8ano', provaAtiva = 'CAED 1';

    // Mapeamento de Coordenadas para o formato da imagem (Grade de 12 questões)
    const coordenadas = [
        { q: 1, options: [{l:'A', x:95}, {l:'B', x:115}, {l:'C', x:135}, {l:'D', x:155}], y: 410 },
        { q: 2, options: [{l:'A', x:95}, {l:'B', x:115}, {l:'C', x:135}, {l:'D', x:155}], y: 440 }
        // ... as demais coordenadas são calculadas dinamicamente abaixo
    ];

    async function colarImagem(e, canvasId, inputId) {
        const item = Array.from(e.clipboardData.items).find(x => x.type.indexOf("image") !== -1);
        if (item) {
            const blob = item.getAsFile();
            const img = new Image();
            img.onload = () => {
                const canvas = document.getElementById(canvasId);
                const ctx = canvas.getContext('2d');
                canvas.width = 600; canvas.height = 800; // Normaliza tamanho
                canvas.style.display = "block";
                ctx.drawImage(img, 0, 0, 600, 800);
                
                // Analisa os pixels nas posições das bolinhas
                detectarRespostas(ctx, inputId);
            };
            img.src = URL.createObjectURL(blob);
        }
    }

    function detectarRespostas(ctx, inputId) {
        let resultado = "";
        // Lógica simplificada: verifica o nível de "escuridão" em pontos da grade
        // Para 12 questões no formato da imagem enviada
        for(let q=0; q<12; q++) {
            let melhorOpcao = "?";
            let minLuz = 255;
            
            // Simulação de busca nas colunas A, B, C, D
            ['A','B','C','D'].forEach((letra, idx) => {
                const x = 100 + (idx * 30); // Ajuste fino baseado na sua imagem
                const y = 400 + (Math.floor(q/2) * 40); // Ajuste vertical
                const pixel = ctx.getImageData(x, y, 1, 1).data;
                const luz = (pixel[0] + pixel[1] + pixel[2]) / 3;
                
                if(luz < minLuz) { minLuz = luz; melhorOpcao = letra; }
            });
            resultado += melhorOpcao;
        }
        document.getElementById(inputId).value = resultado;
        salvarConfig();
    }

    function mudarTurma(t) {
        turma = t;
        document.getElementById('bt8').className = t === '8ano' ? 'btn-turma ativa' : 'btn-turma';
        document.getElementById('bt9').className = t === '9ano' ? 'btn-turma ativa' : 'btn-turma';
        carregarConfig();
    }

    function salvarConfig() {
        const gab = document.getElementById('oficialInput').value.toUpperCase();
        const temas = document.getElementById('temasInput').value;
        db.ref(`prof/v4/${turma}/${provaAtiva}/config`).set({ gab, temas });
    }

    function carregarConfig() {
        db.ref(`prof/v4/${turma}/${provaAtiva}/config`).on('value', snap => {
            const d = snap.val() || {};
            document.getElementById('oficialInput').value = d.gab || "";
            document.getElementById('temasInput').value = d.temas || "";
            ouvirAlunos();
        });
    }

    function salvarAluno() {
        const nome = document.getElementById('nomeAluno').value.toUpperCase();
        const res = document.getElementById('resAluno').value.toUpperCase();
        if(!nome || !res) return alert("Preencha os campos!");
        db.ref(`prof/v4/${turma}/${provaAtiva}/alunos`).push({ nome, res }).then(() => {
            document.getElementById('nomeAluno').value = "";
            document.getElementById('resAluno').value = "";
        });
    }

    function ouvirAlunos() {
        const oficial = document.getElementById('oficialInput').value;
        const temasArr = document.getElementById('temasInput').value.split(',').map(s => s.trim());
        db.ref(`prof/v4/${turma}/${provaAtiva}/alunos`).on('value', snap => {
            const lista = document.getElementById('listaAlunos');
            const grafico = document.getElementById('graficoTemas');
            lista.innerHTML = ""; grafico.innerHTML = "";
            let errosCont = {}, totalA = snap.numChildren();

            snap.forEach(child => {
                const a = child.val();
                let acertos = 0;
                for(let i=0; i<oficial.length; i++) {
                    if(a.res[i] === oficial[i]) acertos++; else errosCont[i+1] = (errosCont[i+1] || 0) + 1;
                }
                lista.innerHTML += `<div class="item-aluno"><strong>${a.nome}</strong>: ${acertos}/${oficial.length}</div>`;
            });

            for(let i=1; i<=oficial.length; i++) {
                let p = totalA > 0 ? Math.round(((errosCont[i]||0)/totalA)*100) : 0;
                grafico.innerHTML += `
                    <div class="rank-item">
                        <small>Q${i}: ${temasArr[i-1] || 'Sem tema'}</small>
                        <div class="barra-bg"><div class="barra-fill" style="width:${p}%"></div></div>
                    </div>`;
            }
        });
    }
    window.onload = () => carregarConfig();
</script>
</body>
</html>
