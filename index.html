<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Scanner Pedagógico | Raquel Aguiar</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fce4ec; padding: 20px; color: #333; }
        .header-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; max-width: 1250px; margin: 0 auto 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .turma-selector { display: flex; gap: 8px; border-right: 2px solid #eee; padding-right: 15px; }
        .testes-nav { display: flex; gap: 8px; align-items: center; flex-grow: 1; overflow-x: auto; }
        .btn-turma { padding: 8px 15px; border: 1px solid #333; background: white; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .btn-turma.ativa { background: #333 !important; color: white !important; }
        .btn-teste { padding: 8px 12px; border: 1px solid #007bff; background: white; color: #007bff; cursor: pointer; font-size: 13px; border-radius: 4px; white-space: nowrap; }
        .btn-teste.ativa { background: #007bff !important; color: white !important; }
        .btn-add { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        
        .main-grid { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 15px; max-width: 1350px; margin: 0 auto; }
        .col { background: white; border: 1px solid #333; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; }
        .col-title { font-weight: bold; text-align: center; border-bottom: 1px solid #eee; margin: -15px -15px 15px -15px; padding: 12px; background: #f9f9f9; }
        
        label { font-size: 12px; font-weight: bold; margin-bottom: 5px; display: block; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-acao { background: #28a745; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 16px; margin-top: auto; }
        
        .barra-bg { background: #eee; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 4px; border: 1px solid #ddd; }
        .barra-fill { height: 100%; background: #28a745; transition: 0.4s; }
        
        /* Detalhes de Acertos/Erros por Aluno */
        .item-aluno { padding: 12px; border-bottom: 1px solid #eee; }
        .aluno-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .mapa-respostas { display: flex; gap: 3px; flex-wrap: wrap; }
        .q-box { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border-radius: 3px; color: white; }
        .q-acerto { background: #28a745; }
        .q-erro { background: #dc3545; }
        
        .btn-excluir { color: #dc3545; cursor: pointer; font-size: 11px; text-decoration: underline; border: none; background: none; }
        .rank-item { margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="header-top">
    <div class="turma-selector">
        <button id="bt8" class="btn-turma ativa" onclick="trocarTurma('8ano')">8º ANO</button>
        <button id="bt9" class="btn-turma" onclick="trocarTurma('9ano')">9º ANO</button>
    </div>
    <div class="testes-nav" id="testesNav"></div>
    <button class="btn-add" onclick="novoBloco()">+ NOVO BLOCO</button>
</div>

<div class="main-grid">
    <div class="col">
        <div class="col-title">1. Configuração e Entrada</div>
        
        <label>Gabarito Mestre (12 Questões):</label>
        <input type="text" id="oficialInput" placeholder="Ex: ABCDABCDABCD" oninput="salvarDB()" maxlength="12">
        
        <label>Habilidades/Temas (Separe por vírgula):</label>
        <textarea id="temasInput" rows="4" placeholder="Ex: Ecossistemas, Cadeia Alimentar, Células..." oninput="salvarDB()"></textarea>
        
        <hr style="width:100%; margin: 15px 0;">
        
        <label>Nome do Aluno:</label>
        <input type="text" id="nomeAluno" placeholder="Nome Completo">
        
        <label>Respostas do Aluno:</label>
        <input type="text" id="resAluno" placeholder="Ex: ABCC..." maxlength="12">
        
        <button class="btn-acao" onclick="salvarAluno()">✅ SALVAR RESULTADO</button>
    </div>

    <div class="col">
        <div class="col-title">2. Desempenho por Questão</div>
        <div id="graficoTemas"></div>
    </div>

    <div class="col">
        <div class="col-title">3. Detalhamento por Aluno</div>
        <div id="listaAlunos"></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://gestao-caed-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let turmaAtual = '8ano', blocoAtual = 'CAED 1';

    function trocarTurma(t) {
        turmaAtual = t;
        document.querySelectorAll('.btn-turma').forEach(b => b.classList.remove('ativa'));
        document.getElementById('bt' + t.replace('ano','')).classList.add('ativa');
        carregarAbas();
    }

    function carregarAbas() {
        db.ref(`prof/v4/${turmaAtual}/provas_lista`).on('value', snap => {
            const nav = document.getElementById('testesNav');
            nav.innerHTML = "";
            let lista = snap.val() || ["CAED 1"];
            lista.forEach(nome => {
                const btn = document.createElement('button');
                btn.className = `btn-teste ${nome === blocoAtual ? 'ativa' : ''}`;
                btn.innerText = nome;
                btn.onclick = () => { blocoAtual = nome; carregarAbas(); };
                nav.appendChild(btn);
            });
            carregarConfig();
        });
    }

    function salvarDB() {
        const gab = document.getElementById('oficialInput').value.toUpperCase().trim();
        const temas = document.getElementById('temasInput').value;
        db.ref(`prof/v4/${turmaAtual}/${blocoAtual}/config`).set({ gab, temas });
    }

    function carregarConfig() {
        db.ref(`prof/v4/${turmaAtual}/${blocoAtual}/config`).on('value', snap => {
            const d = snap.val() || {};
            document.getElementById('oficialInput').value = d.gab || "";
            document.getElementById('temasInput').value = d.temas || "";
            atualizarResultados();
        });
    }

    function salvarAluno() {
        const nome = document.getElementById('nomeAluno').value.toUpperCase().trim();
        const res = document.getElementById('resAluno').value.toUpperCase().trim();
        if(!nome || !res) return alert("Preencha o nome e as respostas!");
        
        db.ref(`prof/v4/${turmaAtual}/${blocoAtual}/alunos`).push({ nome, res });
        document.getElementById('nomeAluno').value = "";
        document.getElementById('resAluno').value = "";
    }

    function atualizarResultados() {
        const oficial = document.getElementById('oficialInput').value;
        const temasArr = document.getElementById('temasInput').value.split(',').map(s => s.trim());
        
        db.ref(`prof/v4/${turmaAtual}/${blocoAtual}/alunos`).on('value', snap => {
            const lista = document.getElementById('listaAlunos'), grafico = document.getElementById('graficoTemas');
            lista.innerHTML = ""; grafico.innerHTML = "";
            let acertosPorQ = {}, totalAlunos = snap.numChildren();

            snap.forEach(child => {
                const a = child.val();
                let acertosCount = 0;
                let mapaHtml = '<div class="mapa-respostas">';
                
                // Comparação Questão a Questão
                for(let i=0; i < 12; i++) {
                    const letraOficial = oficial[i] || "";
                    const letraAluno = a.res[i] || "-";
                    const isCorreto = (letraAluno === letraOficial && letraOficial !== "");
                    
                    if(isCorreto) {
                        acertosCount++;
                        acertosPorQ[i+1] = (acertosPorQ[i+1] || 0) + 1;
                        mapaHtml += `<div class="q-box q-acerto" title="Q${i+1}: Acertou">Q${i+1}</div>`;
                    } else {
                        mapaHtml += `<div class="q-box q-erro" title="Q${i+1}: Errou (Respondeu ${letraAluno})">Q${i+1}</div>`;
                    }
                }
                mapaHtml += '</div>';

                lista.innerHTML += `
                <div class="item-aluno">
                    <div class="aluno-info">
                        <span><b>${a.nome}</b></span>
                        <span style="font-size:12px; color:#28a745"><b>${acertosCount}/12</b></span>
                        <button class="btn-excluir" onclick="excluirAluno('${child.key}')">Remover</button>
                    </div>
                    ${mapaHtml}
                </div>`;
            });

            // Gráfico de Habilidades
            for(let i=1; i <= 12; i++) {
                let p = totalAlunos > 0 ? Math.round(((acertosPorQ[i]||0)/totalAlunos)*100) : 0;
                let tema = temasArr[i-1] || `Questão ${i}`;
                grafico.innerHTML += `
                    <div class="rank-item">
                        <div style="display:flex; justify-content:space-between; font-size:11px;">
                            <span><b>${i}.</b> ${tema}</span>
                            <b>${p}%</b>
                        </div>
                        <div class="barra-bg"><div class="barra-fill" style="width:${p}%"></div></div>
                    </div>`;
            }
        });
    }

    function excluirAluno(id) {
        if(confirm("Deseja remover este aluno?")) {
            db.ref(`prof/v4/${turmaAtual}/${blocoAtual}/alunos`).child(id).remove();
        }
    }

    function novoBloco() {
        const nome = prompt("Nome do novo bloco (Ex: CAED 2, Simulado):");
        if(nome) {
            db.ref(`prof/v4/${turmaAtual}/provas_lista`).once('value', snap => {
                let lista = snap.val() || ["CAED 1"];
                if(!lista.includes(nome)) {
                    lista.push(nome);
                    db.ref(`prof/v4/${turmaAtual}/provas_lista`).set(lista);
                }
            });
        }
    }

    window.onload = () => trocarTurma('8ano');
</script>
</body>
</html>
