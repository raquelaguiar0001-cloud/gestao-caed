<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Scanner Pedagógico | Raquel Aguiar</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fce4ec; padding: 20px; color: #333; }
        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 20px; }
        .turma-selector { display: flex; gap: 10px; }
        .btn-turma { padding: 10px 20px; border: 1px solid #333; background: white; cursor: pointer; font-weight: bold; border-radius: 5px; }
        .btn-turma.ativa { background: #333; color: white; }
        
        .habilidades-panel { background: white; border: 1px solid #333; padding: 15px; margin: 0 auto 20px; max-width: 1068px; display: none; }
        .btn-hab-toggle { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; }

        .main-grid { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 0; max-width: 1100px; margin: 0 auto; border: 1px solid #333; background: white; min-height: 500px; }
        .col { border-right: 1px solid #333; padding: 15px; }
        .col:last-child { border-right: none; }
        .col-title { font-weight: bold; border-bottom: 1px solid #333; margin: -15px -15px 15px -15px; padding: 10px; text-align: center; background: #f9f9f9; }

        input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .upload-area { border: 2px dashed #666; padding: 15px; text-align: center; cursor: pointer; margin-bottom: 10px; background: #fafafa; position: relative; }
        #loading-ocr { display: none; color: #007bff; font-weight: bold; margin-bottom: 5px; }
        #prevImg { max-width: 100%; display: none; margin-top: 5px; border: 1px solid #ddd; }
        
        .btn-acao { background: #28a745; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 4px; }
        
        .rank-item { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .barra-bg { background: #eee; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 5px; }
        .barra-fill { height: 100%; background: #dc3545; transition: 0.5s; }
        .hab-tag { font-size: 11px; color: #555; display: block; margin-top: 3px; font-style: italic; }
        .q-mini { display: inline-block; width: 18px; height: 18px; color: white; text-align: center; line-height: 18px; border-radius: 3px; font-size: 9px; margin: 1px; }
    </style>
</head>
<body>

<div class="header-top">
    <div class="turma-selector">
        <button id="bt8" class="btn-turma ativa" onclick="mudarTurma('8ano')">8º ANO</button>
        <button id="bt9" class="btn-turma" onclick="mudarTurma('9ano')">9º ANO</button>
    </div>
    <button class="btn-hab-toggle" onclick="toggleHab()">⚙️ CONFIGURAR HABILIDADES</button>
</div>

<div id="painelHab" class="habilidades-panel">
    <h3>Mapeamento de Habilidades (<span id="habTurma">8º Ano</span>)</h3>
    <textarea id="temasInput" rows="3" placeholder="Cole aqui as habilidades que eu te enviar..." oninput="salvarConfig()"></textarea>
</div>

<div class="main-grid">
    <div class="col">
        <div class="col-title">Entrada de Dados</div>
        <input type="text" id="oficialInput" placeholder="Gabarito Oficial (Ex: ABCD...)" oninput="salvarConfig()">
        <hr>
        <input type="text" id="nomeAluno" placeholder="Nome Completo do Aluno">
        
        <div class="upload-area" onpaste="colarFoto(event)">
            <div id="loading-ocr">⏳ Lendo gabarito...</div>
            <span>Colar Foto da Prova (Ctrl+V)</span>
            <img id="prevImg">
        </div>
        
        <input type="text" id="resAluno" placeholder="Respostas (Serão preenchidas automaticamente)">
        <button class="btn-acao" onclick="salvarAluno()">SALVAR E CORRIGIR</button>
        <div id="listaAlunos" style="margin-top: 15px;"></div>
    </div>

    <div class="col">
        <div class="col-title">Análise por Habilidade</div>
        <div id="graficoTemas"></div>
    </div>

    <div class="col">
        <div class="col-title">Evolução dos Testes</div>
        <div style="text-align: center; padding: 20px; color: #999;">[ Gráfico CAED ]</div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://gestao-caed-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let turma = '8ano';
    let fotoBase64 = "";

    function toggleHab() {
        const p = document.getElementById('painelHab');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    function mudarTurma(t) {
        turma = t;
        document.getElementById('bt8').className = t === '8ano' ? 'btn-turma ativa' : 'btn-turma';
        document.getElementById('bt9').className = t === '9ano' ? 'btn-turma ativa' : 'btn-turma';
        carregarConfig();
    }

    async function colarFoto(e) {
        const item = Array.from(e.clipboardData.items).find(x => x.type.indexOf("image") !== -1);
        if (item) {
            const reader = new FileReader();
            reader.onload = async (ev) => {
                fotoBase64 = ev.target.result;
                const img = document.getElementById('prevImg');
                img.src = fotoBase64; img.style.display = "block";
                
                // Iniciar Reconhecimento Automático (OCR)
                document.getElementById('loading-ocr').style.display = "block";
                await processarOCR(fotoBase64);
            };
            reader.readAsDataURL(item.getAsFile());
        }
    }

    async function processarOCR(base64) {
        try {
            const result = await Tesseract.recognize(base64, 'eng');
            // Filtra apenas letras A, B, C, D, E e remove espaços/quebras de linha
            const textoLimpo = result.data.text.toUpperCase().replace(/[^A-E]/g, '');
            document.getElementById('resAluno').value = textoLimpo;
        } catch (error) {
            console.error("Erro no OCR:", error);
        } finally {
            document.getElementById('loading-ocr').style.display = "none";
        }
    }

    function salvarConfig() {
        const gab = document.getElementById('oficialInput').value.toUpperCase().replace(/[^A-E]/g, '');
        const temas = document.getElementById('temasInput').value;
        db.ref(`prof/v4/${turma}/config`).set({ gab, temas });
    }

    function carregarConfig() {
        db.ref(`prof/v4/${turma}/config`).on('value', snap => {
            const d = snap.val() || {};
            document.getElementById('oficialInput').value = d.gab || "";
            document.getElementById('temasInput').value = d.temas || "";
            ouvirAlunos();
        });
    }

    function salvarAluno() {
        const nome = document.getElementById('nomeAluno').value.toUpperCase();
        const res = document.getElementById('resAluno').value.toUpperCase();
        if(!nome || !res) return alert("Preencha nome e respostas!");
        db.ref(`prof/v4/${turma}/alunos`).push({ nome, res, foto: fotoBase64 }).then(() => {
            document.getElementById('nomeAluno').value = "";
            document.getElementById('resAluno').value = "";
            document.getElementById('prevImg').style.display = "none";
            fotoBase64 = "";
        });
    }

    function ouvirAlunos() {
        const oficial = document.getElementById('oficialInput').value.replace(/\s/g, '');
        const temasArr = document.getElementById('temasInput').value.split(',').map(s => s.trim());
        
        db.ref(`prof/v4/${turma}/alunos`).on('value', snap => {
            const lista = document.getElementById('listaAlunos');
            const grafico = document.getElementById('graficoTemas');
            lista.innerHTML = ""; grafico.innerHTML = "";
            let errosCont = {}, totalA = snap.numChildren();

            snap.forEach(child => {
                const a = child.val();
                let acertos = 0;
                let boxes = "";
                const resA = (a.res || "").replace(/\s/g, '');
                for(let i=0; i<oficial.length; i++) {
                    const ok = (resA[i] === oficial[i] && oficial[i]);
                    if(ok) acertos++; else errosCont[i+1] = (errosCont[i+1] || 0) + 1;
                    boxes += `<div class="q-mini" style="background:${ok?'#28a745':'#dc3545'};">${i+1}</div>`;
                }
                lista.innerHTML += `<div style="font-size:13px; margin-bottom:8px; border-bottom:1px solid #f0f0f0;">
                    <strong>${a.nome}</strong> (${acertos}/${oficial.length})
                    <div style="display:flex; flex-wrap:wrap;">${boxes}</div>
                </div>`;
            });

            for(let i=1; i<=oficial.length; i++) {
                let pErro = totalA > 0 ? Math.round(((errosCont[i]||0)/totalA)*100) : 0;
                let pAcerto = 100 - pErro;
                grafico.innerHTML += `
                    <div class="rank-item">
                        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:12px;">
                            <span>Questão ${i}</span>
                            <span style="color:#28a745;">${pAcerto}% Acerto</span>
                        </div>
                        <span class="hab-tag">Habilidade: ${temasArr[i-1] || 'Não definida'}</span>
                        <div class="barra-bg"><div class="barra-fill" style="width:${pErro}%;"></div></div>
                    </div>`;
            }
        });
    }
    window.onload = carregarConfig;
</script>
</body>
</html>
