<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Scanner Pedagógico | Raquel Aguiar</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fce4ec; padding: 20px; color: #333; }
        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 15px; }
        .turma-selector { display: flex; gap: 8px; }
        .btn-turma { padding: 8px 15px; border: 1px solid #333; background: white; cursor: pointer; font-weight: bold; }
        .btn-turma.ativa { background: #333; color: white; }
        
        .main-grid { display: grid; grid-template-columns: 1.2fr 1fr 1.2fr; gap: 15px; max-width: 1200px; margin: 0 auto; }
        .col { background: white; border: 1px solid #333; padding: 15px; border-radius: 8px; }
        .col-title { font-weight: bold; text-align: center; border-bottom: 1px solid #eee; margin-bottom: 15px; padding-bottom: 5px; }

        .upload-zone { border: 2px dashed #007bff; padding: 15px; text-align: center; cursor: pointer; background: #f8fbff; margin-bottom: 10px; }
        canvas { max-width: 100%; display: none; margin-top: 10px; border: 1px solid #ccc; }
        
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-acao { background: #28a745; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 16px; }
        
        /* Ajuste Visual da Coluna 3 para não cortar dados */
        .rank-item { margin-bottom: 12px; border-bottom: 1px solid #f0f0f0; padding-bottom: 5px; }
        .barra-bg { background: #eee; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 4px; border: 1px solid #ddd; }
        .barra-fill { height: 100%; background: #28a745; transition: 0.5s; } /* Corrigido para Verde como padrão de acerto */
        .erro-fill { background: #dc3545 !important; } /* Vermelho para erro */
    </style>
</head>
<body>

<div class="header-top">
    <div class="turma-selector">
        <button id="bt8" class="btn-turma ativa" onclick="mudarTurma('8ano')">8º ANO</button>
        <button id="bt9" class="btn-turma" onclick="mudarTurma('9ano')">9º ANO</button>
    </div>
    <div id="testesNav" style="display: flex; gap: 10px;"></div>
</div>

<div class="main-grid">
    <div class="col">
        <div class="col-title">1. Configuração do Teste</div>
        <div class="upload-zone" onpaste="colarManual(event, 'oficialInput')">
            <span>Cole a imagem do Gabarito Oficial</span>
        </div>
        <input type="text" id="oficialInput" placeholder="Gabarito Mestre (Ex: DBADABDDA...)" oninput="salvarConfig()">
        <textarea id="temasInput" rows="4" placeholder="Habilidades BNCC (Separadas por vírgula)" oninput="salvarConfig()"></textarea>
    </div>

    <div class="col">
        <div class="col-title">2. Escaneamento do Aluno</div>
        <input type="text" id="nomeAluno" placeholder="Nome do Aluno">
        <div class="upload-zone" onpaste="colarManual(event, 'resAluno')">
            <span>Cole a Prova do Aluno</span>
        </div>
        <input type="text" id="resAluno" placeholder="Respostas do Aluno">
        <button class="btn-acao" onclick="salvarAluno()">✅ CORRIGIR E SALVAR</button>
    </div>

    <div class="col">
        <div class="col-title">3. Análise Pedagógica</div>
        <div id="graficoTemas"></div>
        <hr>
        <div id="listaAlunos"></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://gestao-caed-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let turma = '8ano', provaAtiva = 'CAED 1';

    // Função simples de colagem para evitar erros de OCR
    function colarManual(e, inputId) {
        const text = e.clipboardData.getData('text');
        if (text) {
            document.getElementById(inputId).value = text.toUpperCase().replace(/[^A-D]/g, '');
        } else {
            alert("Por favor, certifique-se de copiar o texto das respostas ou digitar manualmente para evitar erros de leitura visual até a calibração final.");
        }
    }

    function mudarTurma(t) {
        turma = t;
        document.getElementById('bt8').className = t === '8ano' ? 'btn-turma ativa' : 'btn-turma';
        document.getElementById('bt9').className = t === '9ano' ? 'btn-turma ativa' : 'btn-turma';
        carregarConfig();
    }

    function salvarConfig() {
        const gab = document.getElementById('oficialInput').value.toUpperCase().trim();
        const temas = document.getElementById('temasInput').value;
        db.ref(`prof/v4/${turma}/${provaAtiva}/config`).set({ gab, temas });
    }

    function carregarConfig() {
        db.ref(`prof/v4/${turma}/${provaAtiva}/config`).on('value', snap => {
            const d = snap.val() || {};
            document.getElementById('oficialInput').value = d.gab || "";
            document.getElementById('temasInput').value = d.temas || "";
            ouvirAlunos();
        });
    }

    function salvarAluno() {
        const nome = document.getElementById('nomeAluno').value.toUpperCase().trim();
        const res = document.getElementById('resAluno').value.toUpperCase().trim();
        const oficial = document.getElementById('oficialInput').value.toUpperCase().trim();

        if(!nome || !res || !oficial) return alert("Preencha Nome, Respostas do Aluno e Gabarito Oficial!");
        
        // Proteção: Garante que estamos comparando apenas o número de questões existentes
        const resFinal = res.substring(0, oficial.length);

        db.ref(`prof/v4/${turma}/${provaAtiva}/alunos`).push({ nome, res: resFinal }).then(() => {
            document.getElementById('nomeAluno').value = "";
            document.getElementById('resAluno').value = "";
        });
    }

    function ouvirAlunos() {
        const oficial = document.getElementById('oficialInput').value.trim();
        const temasArr = document.getElementById('temasInput').value.split(',').map(s => s.trim());
        
        db.ref(`prof/v4/${turma}/${provaAtiva}/alunos`).on('value', snap => {
            const lista = document.getElementById('listaAlunos');
            const grafico = document.getElementById('graficoTemas');
            lista.innerHTML = ""; grafico.innerHTML = "";
            let errosCont = {}, totalA = snap.numChildren();

            snap.forEach(child => {
                const a = child.val();
                let acertos = 0;
                // CORREÇÃO DA LÓGICA DE COMPARAÇÃO
                for(let i=0; i < oficial.length; i++) {
                    if(a.res[i] === oficial[i] && oficial[i] !== undefined) {
                        acertos++; 
                    } else {
                        errosCont[i+1] = (errosCont[i+1] || 0) + 1;
                    }
                }
                lista.innerHTML += `<div class="item-aluno"><strong>${a.nome}</strong>: <span style="color:#28a745">${acertos}/${oficial.length} ACERTOS</span></div>`;
            });

            // Geração do Gráfico de Desempenho (Verde para acertos, Barra Cresce conforme erro)
            for(let i=1; i <= oficial.length; i++) {
                let percErro = totalA > 0 ? Math.round(((errosCont[i]||0)/totalA)*100) : 0;
                let percAcerto = 100 - percErro;
                
                grafico.innerHTML += `
                    <div class="rank-item">
                        <div style="display:flex; justify-content:space-between; font-size:11px;">
                            <span>Q${i}: ${temasArr[i-1] || 'Habilidade não definida'}</span>
                            <b>${percAcerto}% acerto</b>
                        </div>
                        <div class="barra-bg">
                            <div class="barra-fill" style="width:${percAcerto}%"></div>
                        </div>
                    </div>`;
            }
        });
    }
    window.onload = () => carregarConfig();
</script>
</body>
</html>
