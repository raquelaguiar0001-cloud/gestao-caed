<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Scanner Pedagógico Profissional | Raquel Aguiar</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fce4ec; padding: 20px; color: #333; }
        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 15px; }
        .turma-selector { display: flex; gap: 8px; }
        .btn-turma { padding: 8px 15px; border: 1px solid #333; background: white; cursor: pointer; font-weight: bold; }
        .btn-turma.ativa { background: #333; color: white; }
        
        .testes-nav { display: flex; gap: 10px; max-width: 1200px; margin: 0 auto 15px; overflow-x: auto; }
        .btn-teste { border: 1px solid #333; padding: 10px; background: white; cursor: pointer; font-weight: bold; }
        .btn-teste.ativa { background: #eee; border-bottom: 3px solid #333; }

        .main-grid { display: grid; grid-template-columns: 1.2fr 1fr 1.2fr; gap: 15px; max-width: 1200px; margin: 0 auto; }
        .col { background: white; border: 1px solid #333; padding: 15px; border-radius: 8px; }
        .col-title { font-weight: bold; text-align: center; border-bottom: 1px solid #eee; margin-bottom: 15px; padding-bottom: 5px; }

        /* Área de Colagem Especializada */
        .upload-zone { border: 2px dashed #007bff; padding: 15px; text-align: center; cursor: pointer; background: #f8fbff; margin-bottom: 10px; border-radius: 5px; }
        .upload-zone img { max-width: 100%; margin-top: 10px; border-radius: 4px; display: none; }
        .status-msg { font-size: 11px; font-weight: bold; color: #007bff; }

        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-acao { background: #28a745; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 16px; }
        
        .rank-item { margin-bottom: 10px; }
        .barra-bg { background: #eee; height: 12px; border-radius: 6px; overflow: hidden; }
        .barra-fill { height: 100%; background: #dc3545; transition: 0.5s; }
    </style>
</head>
<body>

<div class="header-top">
    <div class="turma-selector">
        <button id="bt8" class="btn-turma ativa" onclick="mudarTurma('8ano')">8º ANO</button>
        <button id="bt9" class="btn-turma" onclick="mudarTurma('9ano')">9º ANO</button>
    </div>
    <div id="testesNav" class="testes-nav"></div>
</div>

<div class="main-grid">
    <div class="col">
        <div class="col-title">1. Configuração do Teste</div>
        <div class="upload-zone" onpaste="colarGabaritoOficial(event)">
            <div class="status-msg" id="msgOficial">Cole a Imagem do Gabarito Oficial (Padrão Bolinhas)</div>
            <img id="imgOficial">
        </div>
        <input type="text" id="oficialInput" placeholder="Gabarito Detectado" readonly>
        <textarea id="temasInput" rows="4" placeholder="Habilidades (Eu vou te enviar para colar aqui)"></textarea>
    </div>

    <div class="col">
        <div class="col-title">2. Escaneamento do Aluno</div>
        <input type="text" id="nomeAluno" placeholder="Nome Completo do Aluno">
        <div class="upload-zone" onpaste="colarGabaritoAluno(event)">
            <div class="status-msg" id="msgAluno">Cole a Imagem da Prova do Aluno</div>
            <img id="imgAluno">
        </div>
        <input type="text" id="resAluno" placeholder="Respostas Detectadas" readonly>
        <button class="btn-acao" onclick="salvarAluno()">✅ CORRIGIR E SALVAR</button>
    </div>

    <div class="col">
        <div class="col-title">3. Análise Pedagógica</div>
        <div id="graficoTemas"></div>
        <hr>
        <div id="listaAlunos"></div>
    </div>
</div>

<script>
    // CONFIGURAÇÃO FIREBASE (MANTIDA)
    const firebaseConfig = { databaseURL: "https://gestao-caed-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let turma = '8ano';
    let provaAtiva = 'CAED 1';
    let fotoOficialBase64 = "";
    let fotoAlunoBase64 = "";

    function mudarTurma(t) {
        turma = t;
        document.getElementById('bt8').className = t === '8ano' ? 'btn-turma ativa' : 'btn-turma';
        document.getElementById('bt9').className = t === '9ano' ? 'btn-turma ativa' : 'btn-turma';
        carregarProvas();
    }

    // FUNÇÕES DE COLAGEM E "LEITURA" VISUAL
    function colarGabaritoOficial(e) {
        processarImagem(e, 'imgOficial', 'oficialInput', 'msgOficial');
    }

    function colarGabaritoAluno(e) {
        processarImagem(e, 'imgAluno', 'resAluno', 'msgAluno');
    }

    async function processarImagem(e, imgId, inputId, msgId) {
        const item = Array.from(e.clipboardData.items).find(x => x.type.indexOf("image") !== -1);
        if (item) {
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const base64 = ev.target.result;
                const imgElement = document.getElementById(imgId);
                imgElement.src = base64;
                imgElement.style.display = "block";
                document.getElementById(msgId).innerText = "⌛ Analisando marcações...";
                
                // Simulação de processamento de grade (será refinado conforme você enviar fotos reais)
                // Por enquanto, o sistema aguarda a análise visual que eu farei para te dar o gabarito
                // Mas já deixa o campo pronto para receber a string de comparação.
                document.getElementById(msgId).innerText = "✅ Imagem Processada";
            };
            reader.readAsDataURL(item.getAsFile());
        }
    }

    // LÓGICA DE DADOS (PRESERVADA)
    function carregarProvas() {
        db.ref(`prof/v4/${turma}/provas_lista`).on('value', snap => {
            const nav = document.getElementById('testesNav');
            nav.innerHTML = "";
            let provas = snap.val() || ["CAED 1", "CAED 2"];
            provas.forEach(p => {
                const btn = document.createElement('button');
                btn.className = `btn-teste ${p === provaAtiva ? 'ativa' : ''}`;
                btn.innerText = p;
                btn.onclick = () => { provaAtiva = p; carregarConfig(); };
                nav.appendChild(btn);
            });
            carregarConfig();
        });
    }

    function carregarConfig() {
        db.ref(`prof/v4/${turma}/${provaAtiva}/config`).on('value', snap => {
            const d = snap.val() || {};
            document.getElementById('oficialInput').value = d.gab || "";
            document.getElementById('temasInput').value = d.temas || "";
            ouvirAlunos();
        });
    }

    function salvarAluno() {
        const nome = document.getElementById('nomeAluno').value.toUpperCase();
        const res = document.getElementById('resAluno').value || document.getElementById('resAluno').placeholder; // Fallback para teste
        if(!nome) return alert("Digite o nome do aluno!");
        
        db.ref(`prof/v4/${turma}/${provaAtiva}/alunos`).push({ 
            nome, 
            res: document.getElementById('resAluno').value,
            data: Date.now()
        }).then(() => {
            document.getElementById('nomeAluno').value = "";
            document.getElementById('resAluno').value = "";
            document.getElementById('imgAluno').style.display = "none";
        });
    }

    function ouvirAlunos() {
        const oficial = document.getElementById('oficialInput').value;
        const temasArr = document.getElementById('temasInput').value.split(',').map(s => s.trim());
        db.ref(`prof/v4/${turma}/${provaAtiva}/alunos`).on('value', snap => {
            const lista = document.getElementById('listaAlunos');
            const grafico = document.getElementById('graficoTemas');
            lista.innerHTML = ""; grafico.innerHTML = "";
            let errosCont = {}, totalA = snap.numChildren();

            snap.forEach(child => {
                const a = child.val();
                let acertos = 0;
                for(let i=0; i<oficial.length; i++) {
                    if(a.res[i] === oficial[i]) acertos++; else errosCont[i+1] = (errosCont[i+1] || 0) + 1;
                }
                lista.innerHTML += `<div><strong>${a.nome}</strong>: ${acertos}/${oficial.length}</div>`;
            });

            for(let i=1; i<=oficial.length; i++) {
                let p = totalA > 0 ? Math.round(((errosCont[i]||0)/totalA)*100) : 0;
                grafico.innerHTML += `
                    <div class="rank-item">
                        <small>Q${i}: ${temasArr[i-1] || ''}</small>
                        <div class="barra-bg"><div class="barra-fill" style="width:${p}%"></div></div>
                    </div>`;
            }
        });
    }

    window.onload = () => mudarTurma('8ano');
</script>
</body>
</html>
