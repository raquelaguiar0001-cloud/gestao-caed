<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monitor da Aprendizagem | Raquel Aguiar</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fce4ec; padding: 20px; color: #333; }
        
        /* Menu Superior */
        .header-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; max-width: 1400px; margin: 0 auto 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .turma-selector { display: flex; gap: 8px; border-right: 2px solid #eee; padding-right: 15px; }
        .testes-nav { display: flex; gap: 8px; align-items: center; flex-grow: 1; overflow-x: auto; }
        
        .btn-turma, .btn-evolucao, .btn-download { padding: 8px 15px; border: 1px solid #333; background: white; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .btn-turma.ativa, .btn-evolucao.ativa { background: #333 !important; color: white !important; }
        .btn-download { border-color: #28a745; color: #28a745; }
        .btn-evolucao { border-color: #6a1b9a; color: #6a1b9a; }

        .btn-teste { padding: 8px 12px; border: 1px solid #007bff; background: white; color: #007bff; cursor: pointer; font-size: 13px; border-radius: 4px; white-space: nowrap; }
        .btn-teste.ativa { background: #007bff !important; color: white !important; font-weight: bold; }
        .btn-add { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .del-x { color: #ff4d4d; margin-left: 8px; font-weight: bold; }

        /* Grade Principal */
        .main-grid { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 15px; max-width: 1500px; margin: 0 auto; }
        .col { background: white; border: 1px solid #333; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; }
        .col-title { font-weight: bold; text-align: center; border-bottom: 1px solid #eee; margin: -15px -15px 15px -15px; padding: 12px; background: #f9f9f9; }
        
        label { font-size: 11px; font-weight: bold; margin-top: 10px; display: block; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-acao { background: #28a745; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 16px; margin-top: auto; }
        
        /* Raio-X de Questões */
        .mapa-respostas { display: flex; gap: 3px; margin-top: 8px; flex-wrap: wrap; }
        .q-box { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; border-radius: 3px; color: white; }
        .q-acerto { background: #28a745; }
        .q-erro { background: #dc3545; }
        
        .barra-bg { background: #eee; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 4px; border: 1px solid #ddd; }
        .barra-fill { height: 100%; background: #28a745; transition: 0.4s; }

        /* Painel de Evolução */
        #painelEvolucao { display: none; background: white; border: 1px solid #333; padding: 20px; border-radius: 8px; max-width: 1500px; margin: 0 auto; }
        .tabela-ev { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .tabela-ev th, .tabela-ev td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 13px; }
        .tabela-ev th { background: #f4f4f4; }
    </style>
</head>
<body>

<div class="header-top">
    <div class="turma-selector">
        <button id="bt8" class="btn-turma ativa" onclick="trocarTurma('8ano')">8º ANO</button>
        <button id="bt9" class="btn-turma" onclick="trocarTurma('9ano')">9º ANO</button>
    </div>
    <div class="testes-nav" id="testesNav"></div>
    <button class="btn-add" onclick="novoBloco()">+ NOVO BLOCO</button>
    <button class="btn-evolucao" id="btnEvLink" onclick="abrirEvolucao()">📈 EVOLUÇÃO INDIVIDUAL</button>
    <button class="btn-download" onclick="baixarResultados()">📥 EXCEL</button>
</div>

<div id="painelEvolucao">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>📊 Evolução Individual por Aluno</h3>
        <button onclick="trocarTurma(turmaAtual)" style="cursor:pointer; border:1px solid #333; background: #eee; padding:5px 10px; border-radius:4px;">Voltar para Testes ✖</button>
    </div>
    <p style="font-size:13px;">Selecione os testes para comparar:</p>
    <div id="checkTestes" style="margin-bottom:15px; display:flex; gap:15px; flex-wrap:wrap; background:#f9f9f9; padding:10px; border-radius:5px;"></div>
    <div id="areaTabelaEvolucao" style="overflow-x: auto;"></div>
</div>

<div class="main-grid" id="gridPrincipal">
    <div class="col">
        <div class="col-title">🔬 Entrada de Dados</div>
        <label>GABARITO MESTRE (O sistema adapta o total de questões automaticamente):</label>
        <input type="text" id="oficialInput" placeholder="Ex: ABCDABCD..." oninput="salvarDB()">
        <label>TEMAS DAS QUESTÕES (Separe por vírgula):</label>
        <textarea id="temasInput" rows="3" placeholder="Tema 1, Tema 2..." oninput="salvarDB()"></textarea>
        <hr>
        <label>NOME DO ALUNO:</label>
        <input type="text" id="nomeAluno" placeholder="Nome Completo">
        <label>RESPOSTAS DO ALUNO:</label>
        <input type="text" id="resAluno" placeholder="Ex: AABB..." onkeypress="if(event.key==='Enter') salvarAluno()">
        <button class="btn-acao" id="btnSalvar" onclick="salvarAluno()">✅ SALVAR RESULTADO</button>
    </div>

    <div class="col">
        <div class="col-title">📉 Desempenho da Turma</div>
        <div id="graficoTemas"></div>
    </div>

    <div class="col">
        <div class="col-title">📝 Raio-X Individual</div>
        <div id="listaAlunos"></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://gestao-caed-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let turmaAtual = '8ano', blocoAtual = 'CAED 1', editandoId = null;

    function trocarTurma(t) {
        turmaAtual = t;
        document.querySelectorAll('.btn-turma').forEach(b => b.classList.remove('ativa'));
        document.getElementById('bt' + t.replace('ano','')).classList.add('ativa');
        document.getElementById('painelEvolucao').style.display = 'none';
        document.getElementById('gridPrincipal').style.display = 'grid';
        document.getElementById('btnEvLink').classList.remove('ativa');
        carregarAbas();
    }

    function carregarAbas() {
        db.ref(`prof/v4/${turmaAtual}/provas_lista`).on('value', snap => {
            const nav = document.getElementById('testesNav');
            nav.innerHTML = "";
            let lista = snap.val() || ["CAED 1"];
            lista.forEach(nome => {
                const btn = document.createElement('button');
                btn.className = `btn-teste ${nome === blocoAtual ? 'ativa' : ''}`;
                btn.innerHTML = `${nome} <span class="del-x" onclick="deletarBloco('${nome}')">✖</span>`;
                btn.onclick = (e) => { if(e.target.className !== 'del-x') { blocoAtual = nome; carregarAbas(); } };
                nav.appendChild(btn);
            });
            carregarConfig();
        });
    }

    function salvarDB() {
        const gab = document.getElementById('oficialInput').value.toUpperCase().replace(/\s/g, '');
        const temas = document.getElementById('temasInput').value;
        db.ref(`prof/v4/${turmaAtual}/${blocoAtual}/config`).set({ gab, temas });
    }

    function carregarConfig() {
        db.ref(`prof/v4/${turmaAtual}/${blocoAtual}/config`).on('value', snap => {
            const d = snap.val() || {};
            document.getElementById('oficialInput').value = d.gab || "";
            document.getElementById('temasInput').value = d.temas || "";
            atualizarResultados();
        });
    }

    function salvarAluno() {
        const nome = document.getElementById('nomeAluno').value.toUpperCase().trim();
        const res = document.getElementById('resAluno').value.toUpperCase().replace(/\s/g, '');
        if(!nome || !res) return alert("Preencha Nome e Respostas!");
        const ref = db.ref(`prof/v4/${turmaAtual}/${blocoAtual}/alunos`);
        if(editandoId) {
            ref.child(editandoId).update({ nome, res }).then(() => {
                editandoId = null;
                document.getElementById('btnSalvar').innerText = "✅ SALVAR RESULTADO";
            });
        } else { ref.push({ nome, res }); }
        document.getElementById('nomeAluno').value = "";
        document.getElementById('resAluno').value = "";
    }

    function atualizarResultados() {
        const oficial = document.getElementById('oficialInput').value;
        const temasArr = document.getElementById('temasInput').value.split(',').map(s => s.trim());
        const totalQ = oficial.length;
        
        db.ref(`prof/v4/${turmaAtual}/${blocoAtual}/alunos`).on('value', snap => {
            const lista = document.getElementById('listaAlunos'), grafico = document.getElementById('graficoTemas');
            lista.innerHTML = ""; grafico.innerHTML = "";
            let acertosPorQ = {}, totalA = snap.numChildren();

            snap.forEach(child => {
                const a = child.val();
                let acCount = 0;
                let mapa = '<div class="mapa-respostas">';
                for(let i=0; i < totalQ; i++) {
                    const isCorreto = (a.res[i] === oficial[i] && oficial[i]);
                    if(isCorreto) { acCount++; acertosPorQ[i+1] = (acertosPorQ[i+1] || 0) + 1; }
                    mapa += `<div class="q-box ${isCorreto ? 'q-acerto' : 'q-erro'}" title="Questão ${i+1}">${i+1}</div>`;
                }
                mapa += '</div>';
                lista.innerHTML += `<div class="item-aluno">
                    <div style="display:flex; justify-content:space-between"><b>${a.nome}</b> <span>${acCount}/${totalQ}</span></div>
                    ${mapa}
                    <div style="margin-top:5px; font-size:11px;">
                        <span style="color:blue; cursor:pointer" onclick="editarAluno('${child.key}','${a.nome}','${a.res}')">Editar</span> | 
                        <span style="color:red; cursor:pointer" onclick="excluirAluno('${child.key}')">Remover</span>
                    </div>
                </div>`;
            });

            for(let i=1; i <= totalQ; i++) {
                let p = totalA > 0 ? Math.round(((acertosPorQ[i]||0)/totalA)*100) : 0;
                grafico.innerHTML += `<div style="margin-bottom:8px;"><div style="display:flex; justify-content:space-between; font-size:11px;">
                    <span><b>${i}.</b> ${temasArr[i-1] || '---'}</span><b>${p}%</b></div>
                    <div class="barra-bg"><div class="barra-fill" style="width:${p}%"></div></div></div>`;
            }
        });
    }

    async function abrirEvolucao() {
        document.getElementById('gridPrincipal').style.display = 'none';
        document.getElementById('painelEvolucao').style.display = 'block';
        document.getElementById('btnEvLink').classList.add('ativa');
        
        db.ref(`prof/v4/${turmaAtual}/provas_lista`).once('value', snap => {
            const area = document.getElementById('checkTestes');
            area.innerHTML = "";
            (snap.val() || []).forEach(nome => {
                area.innerHTML += `<label style="cursor:pointer"><input type="checkbox" checked value="${nome}" onchange="renderizarTabelaEvolucao()"> ${nome}</label>`;
            });
            renderizarTabelaEvolucao();
        });
    }

    async function renderizarTabelaEvolucao() {
        const selecionados = Array.from(document.querySelectorAll('#checkTestes input:checked')).map(cb => cb.value);
        const areaTabela = document.getElementById('areaTabelaEvolucao');
        let dadosAlunos = {}; 

        for (const teste of selecionados) {
            const snap = await db.ref(`prof/v4/${turmaAtual}/${teste}`).once('value');
            const oficial = snap.child('config/gab').val() || "";
            const alunos = snap.child('alunos').val() || {};
            Object.values(alunos).forEach(a => {
                let ac = 0;
                for(let i=0; i<oficial.length; i++) if(a.res[i] === oficial[i]) ac++;
                let porc = oficial.length > 0 ? Math.round((ac / oficial.length) * 100) : 0;
                if(!dadosAlunos[a.nome]) dadosAlunos[a.nome] = {};
                dadosAlunos[a.nome][teste] = porc;
            });
        }

        let html = `<table class="tabela-ev"><thead><tr><th>Aluno</th>`;
        selecionados.forEach(t => html += `<th>${t}</th>`);
        html += `</tr></thead><tbody>`;
        Object.keys(dadosAlunos).sort().forEach(nome => {
            html += `<tr><td style="text-align:left"><b>${nome}</b></td>`;
            selecionados.forEach(t => {
                let nota = dadosAlunos[nome][t];
                let cor = nota >= 60 ? "#28a745" : "#dc3545";
                html += `<td style="color:${cor}; font-weight:bold">${nota !== undefined ? nota + '%' : '-'}</td>`;
            });
            html += `</tr>`;
        });
        areaTabela.innerHTML = html + `</tbody></table>`;
    }

    function baixarResultados() {
        db.ref(`prof/v4/${turmaAtual}/${blocoAtual}`).once('value', snap => {
            const oficial = snap.child('config/gab').val() || "";
            const alunos = snap.child('alunos').val() || {};
            const dadosExcel = Object.values(alunos).map(a => {
                let ac = 0;
                for(let i=0; i<oficial.length; i++) if(a.res[i] === oficial[i]) ac++;
                return { "Aluno": a.nome, "Acertos": ac, "Total": oficial.length, "% Aproveitamento": ((ac/oficial.length)*100).toFixed(1)+"%" };
            });
            const ws = XLSX.utils.json_to_sheet(dadosExcel);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Resultados");
            XLSX.writeFile(wb, `Monitor_${turmaAtual}_${blocoAtual}.xlsx`);
        });
    }

    function novoBloco() {
        const nome = prompt("Nome do novo bloco:");
        if(nome) db.ref(`prof/v4/${turmaAtual}/provas_lista`).once('value', snap => {
            let lista = snap.val() || ["CAED 1"];
            if(!lista.includes(nome)) { lista.push(nome); db.ref(`prof/v4/${turmaAtual}/provas_lista`).set(lista); }
        });
    }

    function deletarBloco(nome) {
        if(confirm(`Excluir bloco ${nome}?`)) db.ref(`prof/v4/${turmaAtual}/provas_lista`).once('value', snap => {
            let lista = snap.val().filter(p => p !== nome);
            db.ref(`prof/v4/${turmaAtual}/provas_lista`).set(lista);
            db.ref(`prof/v4/${turmaAtual}/${nome}`).remove();
        });
    }

    function editarAluno(id, nome, res) {
        editandoId = id;
        document.getElementById('nomeAluno').value = nome;
        document.getElementById('resAluno').value = res;
        document.getElementById('btnSalvar').innerText = "💾 ATUALIZAR";
    }

    function excluirAluno(id) {
        if(confirm("Remover este aluno?")) db.ref(`prof/v4/${turmaAtual}/${blocoAtual}/alunos`).child(id).remove();
    }

    window.onload = () => trocarTurma('8ano');
</script>
</body>
</html>
